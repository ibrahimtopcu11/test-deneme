<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Prensesim için 💖</title>
  <meta name="description" content="Sadece senin için hazırlandı." />
  <meta name="theme-color" content="#f7c6d9" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="hearts" aria-hidden="true"></canvas>

  <main id="stage">

    <!-- 1. Zarf / giriş -->
    <section class="scene is-active" id="scene-intro">
      <svg class="crown" viewBox="0 0 120 80" aria-hidden="true">
        <defs>
          <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f6dc96"/>
            <stop offset="1" stop-color="#c99436"/>
          </linearGradient>
        </defs>
        <path d="M10 66 L16 22 L38 44 L60 10 L82 44 L104 22 L110 66 Z" fill="url(#gold)" stroke="#a87525" stroke-width="2" stroke-linejoin="round"/>
        <rect x="10" y="64" width="100" height="10" rx="3" fill="url(#gold)" stroke="#a87525" stroke-width="2"/>
        <circle cx="60" cy="10" r="5" fill="#e8407a"/>
        <circle cx="16" cy="22" r="4" fill="#f7a8c8"/>
        <circle cx="104" cy="22" r="4" fill="#f7a8c8"/>
        <path d="M60 50 c-4-6-12-4-12 2 c0 6 12 12 12 12 s12-6 12-12 c0-6-8-8-12-2z" fill="#e8407a"/>
      </svg>
      <p class="intro-text">Prensesim, bu sayfa sadece senin için.</p>

      <button class="envelope" id="open-envelope" aria-label="Mektubu aç">
        <span class="env-back"></span>
        <span class="env-letter">💌</span>
        <span class="env-front"></span>
        <span class="env-flap"></span>
        <span class="env-seal">❤</span>
      </button>
      <p class="hint">Mektubu açmak için dokun</p>
    </section>

    <!-- 2. İsim -->
    <section class="scene" id="scene-name" aria-live="polite">
      <h1 class="name" id="name-line"></h1>
      <p class="love-line" id="love-line"></p>
      <p class="from-line" id="from-line"></p>
      <button class="btn btn-soft reveal-late" data-next="scene-letter">Devam et</button>
    </section>

    <!-- 3. Özür mektubu -->
    <section class="scene" id="scene-letter">
      <article class="letter">
        <p class="letter-greeting">Canım Sena'm,</p>
        <div id="letter-lines"></div>
        <p class="letter-sign">Seni çok seven,<br><span>İbrahim</span></p>
      </article>
      <button class="btn btn-soft reveal-late" data-next="scene-question">Devam et</button>
    </section>

    <!-- 4. Soru -->
    <section class="scene" id="scene-question">
      <div class="big-heart" aria-hidden="true">❤</div>
      <h2 class="question">Benimle barışır mısın?</h2>
      <div class="choices" id="choices">
        <button class="btn btn-yes" id="btn-yes">Evet 💖</button>
        <button class="btn btn-no" id="btn-no">Hayır</button>
      </div>
    </section>

    <!-- 5. Final -->
    <section class="scene" id="scene-final">
      <div class="final-heart" aria-hidden="true">
        <svg viewBox="0 0 100 90"><path d="M50 86 C20 64 2 46 2 26 C2 12 13 2 27 2 C37 2 45 8 50 16 C55 8 63 2 73 2 C87 2 98 12 98 26 C98 46 80 64 50 86Z"/></svg>
      </div>
      <h2 class="final-title">Seni seviyorum!</h2>
      <p class="final-line">Evet, sen de benim her şeyimsin.</p>
      <p class="promise">Söz veriyorum prensesim,<br>bir daha seni üzmeyeceğim.</p>
      <button class="btn btn-ghost" id="replay">Baştan izle</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
